name: OpenDuet Android APK
on:
  push:
    branches: [openduet-mobile]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: "1"
      - name: Build release APK (debug-signed, JS bundled)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDuet-android
          path: android/app/build/outputs/apk/release/*.apk

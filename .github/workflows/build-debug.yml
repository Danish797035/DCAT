name: Build D~C@T Debug APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build termux debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleTermuxDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DCAT-termux-debug
          path: app/build/outputs/apk/termux/debug/*.apk
